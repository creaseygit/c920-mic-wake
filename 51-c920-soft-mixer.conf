## Logitech C920 (046d:082d): never use the webcam's hardware mute.
## If an app starts the mic while the hardware mute is on, the C920 keeps streaming pure
## silence after unmute (until replugged). A soft mixer does mute/volume in PipeWire instead.
## See https://github.com/creaseygit/c920-mic-wake

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-046d_HD_Pro_Webcam_C920*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
